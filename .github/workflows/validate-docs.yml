name: Validate Docs Folder


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD PNG exists
        run: |
          if ! find docs -iname "*erd*.png" | grep -q .; then
            echo "ERROR: No ERD .png file found in /docs."
            exit 1
          fi
          echo "ERD PNG found."

      - name: Check API endpoint plan exists
        run: |
        if ! find docs -iname "*endpoint*" \( -iname "*.md" -o -iname "*.pdf" -o -iname "*.png" \) | grep -q .; then
          
           echo "ERROR: No API endpoint plan (.md or .pdf) found in /docs."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check SQL script exists
        run: |
          if ! find docs -iname "*.sql" | grep -q .; then
            echo "ERROR: No .sql database script found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from the repository root."
            exit 1
          fi
          echo "README found."

      - name: All required files present
        run: echo "SUCCESS - docs folder structure is valid."
